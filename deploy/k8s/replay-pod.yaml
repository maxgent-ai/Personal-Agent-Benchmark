# One replay run = one Pod: the replay proxy and the browser share localhost.
# The NetworkPolicy below forbids all egress, so nothing reaches the internet even if the
# plugin fails. CDP (9223) is reached from the orchestrator through ingress only.
apiVersion: v1
kind: Pod
metadata:
  name: replay-amazon-airpods
  labels:
    app: pab-replay
    pab/role: replay
spec:
  restartPolicy: Never
  volumes:
    - name: task
      persistentVolumeClaim:
        claimName: pab-task-amazon-airpods    # tasks/amazon-airpods/ from the repository, read-only
    - name: cache                             # the recording is unpacked here at start
      emptyDir: {}
    - name: logs
      emptyDir: {}
  containers:
    - name: replay
      image: pab-replay:latest
      ports:
        - containerPort: 8899
      volumeMounts:
        - { name: task, mountPath: /task, readOnly: true }
        - { name: cache, mountPath: /cache }
        - { name: logs, mountPath: /logs }
      readinessProbe:
        exec:
          command: ["node", "-e", "require('http').get({host:'127.0.0.1',port:8899,path:'http://rr.control/health',headers:{Host:'rr.control'}},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
        periodSeconds: 2
    - name: browser
      image: pab-browser:latest
      env:
        - name: RR_PROXY
          value: http://127.0.0.1:8899      # page clocks are shifted by the replay service
      ports:
        - containerPort: 9223              # CDP, forwarded by socat inside the container
      readinessProbe:                       # Chromium's CDP listens on localhost:9222 only
        exec:
          command: ["socat", "-u", "OPEN:/dev/null", "TCP:127.0.0.1:9222"]
        periodSeconds: 2
