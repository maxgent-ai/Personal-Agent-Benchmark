# Same Pod as deploy/k8s/replay-pod.yaml, with the task directory from a hostPath, plus a driver Pod
# labelled as the orchestrator (the only thing allowed to reach CDP).
apiVersion: v1
kind: Pod
metadata:
  name: replay-amazon-airpods
  labels:
    app: pab-replay
    pab/role: replay
spec:
  restartPolicy: Never
  volumes:
    - name: task
      hostPath: { path: /repo/tasks/amazon-airpods, type: Directory }
    - name: cache
      emptyDir: {}
    - name: logs
      emptyDir: {}
  containers:
    - name: replay
      image: pab-replay:latest
      imagePullPolicy: Never
      volumeMounts:
        - { name: task, mountPath: /task, readOnly: true }
        - { name: cache, mountPath: /cache }
        - { name: logs, mountPath: /logs }
      readinessProbe:
        exec:
          command: ["node", "-e", "require('http').get({host:'127.0.0.1',port:8899,path:'http://rr.control/health',headers:{Host:'rr.control'}},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
        periodSeconds: 2
    - name: browser
      image: pab-browser:latest
      imagePullPolicy: Never
      env:
        - { name: RR_PROXY, value: "http://127.0.0.1:8899" }
      ports:
        - containerPort: 9223
      readinessProbe:                       # Chromium's CDP listens on localhost:9222 only
        exec:
          command: ["socat", "-u", "OPEN:/dev/null", "TCP:127.0.0.1:9222"]
        periodSeconds: 2
---
apiVersion: v1
kind: Pod
metadata:
  name: orchestrator
  labels:
    app: bench-orchestrator
spec:
  restartPolicy: Never
  volumes:
    - name: repo
      hostPath: { path: /repo, type: Directory }
  containers:
    - name: driver
      image: node:22-slim
      imagePullPolicy: Never
      command: ["sleep", "3600"]
      workingDir: /repo
      volumeMounts:
        - { name: repo, mountPath: /repo, readOnly: true }
---
apiVersion: v1
kind: Pod
metadata:
  name: outsider
  labels:
    app: not-allowed
spec:
  restartPolicy: Never
  containers:
    - name: probe
      image: node:22-slim
      imagePullPolicy: Never
      command: ["sleep", "3600"]
