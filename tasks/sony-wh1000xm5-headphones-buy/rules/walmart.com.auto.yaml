# Inferred from the recordings of this task; regenerated whenever one is packed or imported. Do not edit:
# corrections go into a hand-written rules file for site "walmart.com", which takes precedence.
site: walmart.com
hosts:
  - walmart.com
  - "*.walmart.com"
drop_params:
  - url
block:
  - www.walmart.com/px/PXu6b0qd2S/init.js*
  - www.walmart.com/px/PXu6b0qd2S/captcha/captcha.js*
exclude:
  - www.walmart.com/blocked/**
endpoints:
  - name: auto_suggest_10
    match: GET /typeahead/v3/complete
    host: www.walmart.com
    kind: search
    text_param: term
    keep_params:
      - term
    similarity: 0.3
  - name: auto_suggest_11
    match: GET /search
    host: www.walmart.com
    kind: search
    text_param: q
    keep_params:
      - q
    similarity: 0.3
