# Inferred from the recordings of this task; regenerated whenever one is packed or imported. Do not edit:
# corrections go into a hand-written rules file for site "bestbuy.com", which takes precedence.
site: bestbuy.com
hosts:
  - bestbuy.com
  - "*.bestbuy.com"
drop_params:
  - b
body_drop:
  - cartTimestamp
block:
  - streams.bestbuy.com/customer/web-streams/v1/events/digital-experience-event*
  - upa-logger.east.aws.openshift.bestbuy.com
endpoints:
  - name: auto_suggest_4
    match: GET /suggest/v1/fragment/suggest/www
    host: www.bestbuy.com
    kind: search
    text_param: query
    keep_params:
      - query
    similarity: 0.3
  - name: auto_search_5
    match: GET /site/searchpage.jsp
    host: www.bestbuy.com
    kind: search
    text_param: st
    keep_params:
      - st
