# Inferred from the recordings of this task; regenerated whenever one is packed or imported. Do not edit:
# corrections go into a hand-written rules file for site "target.com", which takes precedence.
site: target.com
hosts:
  - target.com
  - "*.target.com"
drop_params:
  - field_groups
endpoints:
  - name: auto_suggest_12
    match: GET /search_box/v3/suggestions
    host: typeahead.target.com
    kind: search
    text_param: q
    keep_params:
      - q
    similarity: 0.3
