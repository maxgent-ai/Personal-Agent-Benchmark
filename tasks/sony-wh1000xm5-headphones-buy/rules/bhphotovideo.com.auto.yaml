# Inferred from the recordings of this task; regenerated whenever one is packed or imported. Do not edit:
# corrections go into a hand-written rules file for site "bhphotovideo.com", which takes precedence.
site: bhphotovideo.com
hosts:
  - bhphotovideo.com
  - "*.bhphotovideo.com"
drop_params:
  - cliReqId
  - ray
body_drop:
  - clientTimestamp
block:
  - www.bhphotovideo.com/aperture/client/logs*
endpoints:
  - name: auto_suggest_8
    match: GET /api/header/searchsuggestions
    host: www.bhphotovideo.com
    kind: search
    text_param: term
    keep_params:
      - term
    similarity: 0.3
  - name: auto_search_9
    match: GET /c/search
    host: www.bhphotovideo.com
    kind: search
    text_param: q
    keep_params:
      - q
