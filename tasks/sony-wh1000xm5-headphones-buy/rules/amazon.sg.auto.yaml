endpoints:
  - name: auto_page_1
    match: GET /*/dp/{id}/**
    host: www.amazon.sg
    key: /dp/{id}
    keep_params: []
  - name: auto_page_2
    match: GET /dp/{id}/**
    host: www.amazon.sg
    key: /dp/{id}
    keep_params: []
  - name: auto_suggest_1
    match: GET /suggestions
    host: www.amazon.sg
    kind: search
    text_param: prefix
    keep_params:
      - prefix
    similarity: 0.3
  - name: auto_search_2
    match: GET /s
    host: www.amazon.sg
    kind: search
    text_param: k
    keep_params:
      - k
